name: CI

on:
  push:
  pull_request:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Pinned: leanprover/elan tag v4.4.0 (commit 3cc76985a1becb3c03cd65c1c5007e6f186ae474).
      ELAN_INIT_REF: 3cc76985a1becb3c03cd65c1c5007e6f186ae474
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/cache v4.2.0
      - name: Cache elan toolchains and Lake build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.elan
            .lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-${{ hashFiles('**/*.lean', '!.lake/**') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-
            lean-${{ runner.os }}-${{ runner.arch }}-

      - name: Install elan and the pinned toolchain
        run: |
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_INIT_REF}/elan-init.sh" -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Lint Python scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          find scripts Tests -name '*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Build libraries
        run: lake build

      - name: Build test executable
        run: lake build tests

      # Corpus-backed suites (box, marker, ...) skip silently without the files.
      - name: Cache corpus
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: corpus/files
          key: corpus-${{ hashFiles('corpus/manifest.json') }}

      - name: Fetch corpus
        run: python3 -I scripts/fetch-corpus.py

      - name: Tests
        run: lake exe tests

      # Linux only: Ubuntu's libopenjp2-tools provides opj_dump (header differential, task
      # 1.7); liblcms2-utils provides tificc, with which the JP2 conformance harness applies
      # the embedded ICC profiles of file5/7/8 (task 6.3a, test-only colour management).
      # Installed after `lake exe tests` (whose jp2 suite then skips the ICC files) so the
      # test suites keep their tool-less CI behaviour; macOS runs without them.
      - name: Install opj_dump and tificc
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenjp2-tools liblcms2-utils
          opj_dump -h 2>&1 | head -n 3 || true
          python3 -I scripts/icc-apply.py --check

      # T.803 conformance (task 5.6b): every p0/p1 stream against the reference decodes;
      # fails on any class-1 failure (M5); class 0 is reported, informational. Also the nine
      # JP2 references jp2_N.tif (task 6.3a, ICC applied through tificc): any failure fails.
      # Linux only.
      - name: T.803 and JP2 conformance
        if: runner.os == 'Linux'
        run: lake build conformance && .lake/build/bin/conformance

      - name: Build header-dump
        if: runner.os == 'Linux'
        run: lake build header-dump

      - name: Header differential (opj_dump -i vs header-dump)
        if: runner.os == 'Linux'
        run: python3 -I scripts/diff-headers.py

      # PDF-extracted JPX corpus (task 6.3b): the source PDFs come with the corpus fetch
      # (role pdf-source, pinned GitHub raw URLs); qpdf extracts the JPXDecode streams
      # (SHA-256-checked against the manifest's pdf_jpx list), then every stream is decoded
      # by opj_decompress and image-dump and compared per component. Linux only.
      - name: PDF JPX corpus and image differential (opj_decompress vs image-dump)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y qpdf
          python3 -I scripts/extract-pdf-jpx.py
          lake build image-dump
          python3 -I scripts/diff-images.py

      # Per-code-block differential against an instrumented OpenJPEG (task 4.6b): Tier-2
      # segments (M4) and Tier-1 coefficients (M3) on every T.803 stream and conformance JP2.
      # Linux only; the instrumented decoder is built from a pinned, hash-verified tarball.
      # actions/cache v4.2.0
      - name: Cache instrumented OpenJPEG
        if: runner.os == 'Linux'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: .lake/opj-instrumented
          key: opj-instrumented-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-opj-instrumented.sh', 'scripts/opj-instrument.patch') }}

      - name: Build instrumented OpenJPEG
        if: runner.os == 'Linux'
        run: scripts/build-opj-instrumented.sh

      - name: Build segment-dump
        if: runner.os == 'Linux'
        run: lake build segment-dump

      - name: Segment and coefficient differential (OpenJPEG dump vs segment-dump)
        if: runner.os == 'Linux'
        run: python3 -I scripts/diff-segments.py

      # Fuzz smoke run (task 9.1): 300 deterministic mutations of the corpus streams through
      # JPEG2000.decode under tight limits, no opj. Fails on a limit escape. Linux only.
      - name: Fuzz smoke
        if: runner.os == 'Linux'
        run: scripts/fuzz.sh --iters 300 --limits tight

      - name: Proof hygiene guard
        run: scripts/check-hygiene.sh

  # Corpus fetch + SHA-256 verification (manifest pins every file), separate from the build.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/cache v4.2.0
      - name: Cache corpus files
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: corpus/files
          key: corpus-${{ hashFiles('corpus/manifest.json') }}

      - name: Fetch corpus (missing files only; verifies SHA-256)
        run: python3 -I scripts/fetch-corpus.py

      - name: Verify every corpus file
        run: python3 -I scripts/fetch-corpus.py --check
