name: CI

on:
  push:
  pull_request:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Pinned: leanprover/elan tag v4.4.0 (commit 3cc76985a1becb3c03cd65c1c5007e6f186ae474).
      ELAN_INIT_REF: 3cc76985a1becb3c03cd65c1c5007e6f186ae474
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/cache v4.2.0
      - name: Cache elan toolchains and Lake build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.elan
            .lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-${{ hashFiles('**/*.lean', '!.lake/**') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-
            lean-${{ runner.os }}-${{ runner.arch }}-

      - name: Install elan and the pinned toolchain
        run: |
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_INIT_REF}/elan-init.sh" -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Lint Python scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          find scripts Tests -name '*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Build libraries
        run: lake build

      - name: Build test executable
        run: lake build tests

      # Corpus-backed suites (box, marker, ...) skip silently without the files.
      - name: Cache corpus
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: corpus/files
          key: corpus-${{ hashFiles('corpus/manifest.json') }}

      - name: Fetch corpus
        run: python3 -I scripts/fetch-corpus.py

      - name: Tests
        run: lake exe tests

      # Header differential against OpenJPEG's opj_dump (task 1.7). Linux only: Ubuntu's
      # libopenjp2-tools provides opj_dump; macOS runs the build and tests without it.
      - name: Install opj_dump
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenjp2-tools
          opj_dump -h 2>&1 | head -n 3 || true

      - name: Build header-dump
        if: runner.os == 'Linux'
        run: lake build header-dump

      - name: Header differential (opj_dump -i vs header-dump)
        if: runner.os == 'Linux'
        run: python3 -I scripts/diff-headers.py

      - name: Proof hygiene guard
        run: scripts/check-hygiene.sh

  # Corpus fetch + SHA-256 verification (manifest pins every file), separate from the build.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/cache v4.2.0
      - name: Cache corpus files
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: corpus/files
          key: corpus-${{ hashFiles('corpus/manifest.json') }}

      - name: Fetch corpus (missing files only; verifies SHA-256)
        run: python3 -I scripts/fetch-corpus.py

      - name: Verify every corpus file
        run: python3 -I scripts/fetch-corpus.py --check
